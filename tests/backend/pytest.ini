[pytest]
# Pytest configuration for backend testing

# Test discovery
testpaths = tests/backend
python_files = test_*.py *_test.py
python_classes = Test* *Tests
python_functions = test_*

# Output and reporting
addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    --color=yes
    --durations=10
    --maxfail=3

# Markers
markers =
    integration: Integration tests that test component interactions
    performance: Performance and load testing
    api_dependent: Tests that require external API access
    slow: Tests that take longer than 30 seconds to run
    unit: Fast unit tests for individual functions
    bug_validation: Tests that validate specific bug fixes
    data_quality: Tests for data validation and quality metrics
    error_handling: Tests for error conditions and resilience

# Minimum version requirements
minversion = 6.0

# Test timeout (in seconds)
timeout = 300

# Disable warnings for cleaner output
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:requests.*
    ignore::UserWarning:urllib3.*

# Coverage settings (if using pytest-cov)
# addopts = --cov=unified_ohlcv_collector --cov=cmc_real_time_monitor --cov-report=html --cov-report=term

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/backend/test.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(funcName)s(): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S